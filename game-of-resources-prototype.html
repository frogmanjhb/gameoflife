<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our World 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<style>
@property --bg{syntax:'<color>';inherits:true;initial-value:#f4efe3}
@property --panel{syntax:'<color>';inherits:true;initial-value:#fffaf0}
@property --line{syntax:'<color>';inherits:true;initial-value:#e3d9c4}
@property --ink{syntax:'<color>';inherits:true;initial-value:#22303a}
@property --muted{syntax:'<color>';inherits:true;initial-value:#5f6b70}
@property --accent{syntax:'<color>';inherits:true;initial-value:#2f7d6d}
@property --accent-ink{syntax:'<color>';inherits:true;initial-value:#ffffff}
@property --accent-tint{syntax:'<color>';inherits:true;initial-value:#dcefe8}
@property --chip{syntax:'<color>';inherits:true;initial-value:#efe7d6}
:root{
  --bg:#f4efe3;--panel:#fffaf0;--line:#e3d9c4;--ink:#22303a;--muted:#5f6b70;
  --accent:#2f7d6d;--accent-ink:#ffffff;--accent-tint:#dcefe8;--chip:#efe7d6;
  --forest:#3f7d3a;--soil:#9a6b3f;--water:#3a8fc7;--pollution:#7b7f86;--habitat:#9b5aa0;
  --good:#2f8f4e;--warn:#c97a1e;--bad:#c4473a;--shadow:60,48,28;
  --ease:cubic-bezier(.22,.8,.24,1);
  --font-d:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --font-b:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:#f4efe3;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#f4efe3;color:#22303a;font-family:var(--font-b);font-size:15px;line-height:1.4;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
.ic.lg{width:26px;height:26px}

/* ---------- shell ---------- */
.game{
  height:100%;display:grid;grid-template-rows:60px minmax(0,1fr);
  background:var(--bg);color:var(--ink);overflow:hidden;
  transition:--bg .6s,--panel .6s,--line .6s,--ink .6s,--muted .6s,--accent .6s,--accent-ink .6s,--accent-tint .6s,--chip .6s;
}
.game[data-light='dusk']{
  --bg:#121a1f;--panel:#1a242b;--line:#2c3a42;--ink:#eef2ee;--muted:#a3b0b2;
  --accent:#6cc4ad;--accent-ink:#0f1a1d;--accent-tint:#1f3a36;--chip:#22303a;--shadow:0,0,0;
}
.topbar{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{font-family:var(--font-d);font-weight:600;font-size:24px;margin:0;white-space:nowrap;letter-spacing:.2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--chip);font-weight:700;font-size:14px;white-space:nowrap}
.round-chip.is-open{background:var(--accent-tint);color:var(--accent)}
.treasury{display:flex;align-items:center;gap:6px;white-space:nowrap}
.treasury .num{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.treasury .lbl{font-size:14px;color:var(--muted)}
.gauges{display:flex;gap:8px;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.gauge{display:grid;grid-template-columns:auto 1fr;column-gap:6px;align-items:center;padding:4px 9px;border-radius:12px;background:var(--bg);min-width:136px;position:relative}
.gauge .g-ic{grid-row:span 2}
.gauge .g-top{display:flex;align-items:baseline;gap:6px;font-size:14px;white-space:nowrap}
.gauge .g-name{color:var(--muted);font-weight:600}
.gauge .g-num{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;min-width:2ch}
.gauge .g-bot{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;white-space:nowrap}
.gauge .g-bar{width:38px;height:6px;border-radius:6px;background:var(--line);overflow:hidden;flex:none}
.gauge .g-bar span{display:block;height:100%;border-radius:6px;transition:width .8s var(--ease),background-color .6s}
.gauge[data-s='good'] .g-word{color:var(--good)}
.gauge[data-s='warn'] .g-word{color:var(--warn)}
.gauge[data-s='bad'] .g-word{color:var(--bad)}
.gauge[data-s='good'] .g-bar span{background:var(--good)}
.gauge[data-s='warn'] .g-bar span{background:var(--warn)}
.gauge[data-s='bad'] .g-bar span{background:var(--bad)}
.g-delta,.g-ghost{display:inline-flex;align-items:center;font-size:14px;font-weight:800;opacity:0;transition:opacity .3s}
.g-delta.show,.g-ghost.show{opacity:1}
.g-delta.up,.g-ghost.up{color:var(--good)}
.g-delta.down,.g-ghost.down{color:var(--bad)}
.gauge.ghosting{box-shadow:0 0 0 2px var(--accent) inset}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:15px;cursor:pointer;transition:background-color .2s,transform .2s var(--ease)}
.btn:hover{background:var(--chip)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn[aria-disabled='true']{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.only-narrow{display:none}
.teacher-btn{white-space:nowrap;padding:8px 12px}

.main{display:grid;grid-template-columns:240px minmax(0,1fr) clamp(300px,28vw,360px);min-height:0;transition:grid-template-columns .6s var(--ease)}
.game.expanded .main{grid-template-columns:0px minmax(0,1fr) 0px}
.citizen,.context{background:var(--panel);min-height:0;overflow:hidden;transition:opacity .45s var(--ease),transform .6s var(--ease)}
.citizen{border-right:1px solid var(--line);display:flex;flex-direction:column}
.context{border-left:1px solid var(--line);display:flex;flex-direction:column}
.game.expanded .citizen{opacity:0;transform:translateX(-24px);pointer-events:none}
.game.expanded .context{opacity:0;transform:translateX(24px);pointer-events:none}

/* ---------- citizen ---------- */
.cz-body{padding:14px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.who{display:flex;gap:10px;align-items:center}
.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--pc,#888);color:#fff;flex:none}
.pseudo{font-family:var(--font-d);font-weight:600;font-size:20px;margin:0;line-height:1.1}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);margin-top:4px}
.sec-title{font-size:14px;font-weight:800;color:var(--muted);margin:0 0 6px}
.xpbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 4px}
.xpbar span{display:block;height:100%;background:var(--accent);transition:width .8s var(--ease)}
.small{font-size:14px;color:var(--muted)}
.pips{display:flex;gap:6px;margin-top:4px}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);background:transparent;transition:background-color .4s var(--ease),transform .4s var(--ease)}
.pip.on{background:var(--accent)}
.pip.spent{transform:scale(.85)}
.wallet{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.inv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inv-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:var(--bg)}
.inv-item b{font-size:17px;font-variant-numeric:tabular-nums}
.inv-item span{font-size:14px;color:var(--muted)}
.notice{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:12px;font-size:14px;font-weight:600}
.notice.warn{background:color-mix(in srgb,var(--warn) 16%,var(--panel));color:var(--ink)}
.notice.info{background:var(--accent-tint)}
.switcher{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
select,input[type='text'],input[type='number'],textarea{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 10px;font-size:15px;width:100%}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}

/* ---------- stage ---------- */
.stage{position:relative;overflow:hidden;min-width:0;background:linear-gradient(180deg,#cfe5e8 0%,#e7eee6 55%,#eef0e4 100%);outline:none;touch-action:none}
.game[data-light='dusk'] .stage{background:linear-gradient(180deg,#26384a 0%,#1a2731 55%,#151f26 100%)}
.stage:focus-visible{box-shadow:inset 0 0 0 3px var(--accent)}
.stage.is-night::after{content:'';position:absolute;inset:0;background:rgba(8,14,26,.55);pointer-events:none;transition:opacity .6s}
.canvas-host{position:absolute;inset:0}
.canvas-host canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.canvas-host canvas:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl3d{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap;font-size:14px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:0 2px 8px rgba(var(--shadow),.18);transform:translate(-50%,-100%)}
.lbl3d.tile-name{background:color-mix(in srgb,var(--panel) 88%,transparent)}
.lbl3d.sel{border:2px solid #e5a92b}
.lbl3d.float{background:var(--accent);color:var(--accent-ink);font-size:15px}
.lbl3d.mult{font-size:14px;background:color-mix(in srgb,var(--panel) 90%,transparent)}
.pin{position:absolute;left:0;top:0;pointer-events:auto;width:44px;height:44px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center;will-change:transform}
.pin .pin-dot{width:32px;height:32px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);display:grid;place-items:center;background:var(--panel);border:2px solid var(--accent);box-shadow:0 3px 8px rgba(var(--shadow),.25);transition:transform .3s var(--ease)}
.pin .pin-dot svg{transform:rotate(45deg);color:var(--accent)}
.pin:hover .pin-dot,.pin.is-sel .pin-dot{transform:rotate(-45deg) scale(1.12)}
.pin.done .pin-dot{border-color:var(--good)}
.pin.done .pin-dot svg{color:var(--good)}
.rail{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:3}
.rail button,.turn button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(var(--shadow),.14)}
.rail button[aria-pressed='true']{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.turn{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);display:flex;gap:6px;padding:5px;border-radius:999px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);z-index:3}
.turn button{box-shadow:none}
.turn button.wide{width:auto;padding:0 14px;border-radius:999px;display:inline-flex;gap:6px;font-weight:700}
.caption{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);margin:0;font-size:14px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:4px 12px;border-radius:999px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3}
.hint{position:absolute;right:12px;top:12px;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--panel);box-shadow:0 2px 8px rgba(var(--shadow),.14);transition:opacity .8s var(--ease);z-index:3}
.hint.gone{opacity:0;pointer-events:none}
.device-tag{position:absolute;left:12px;top:12px;display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip);z-index:3}
.lite-btn{position:absolute;right:12px;bottom:8px;min-height:44px;font-size:14px;z-index:3}
.closed-banner{position:absolute;left:50%;top:56px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:15px;z-index:4;max-width:calc(100% - 140px)}
.night{position:absolute;inset:0;display:grid;place-items:center;z-index:6;pointer-events:none}
.night-card{pointer-events:auto;text-align:center;color:#eef2ee;background:rgba(10,18,28,.72);border-radius:20px;padding:22px 26px;max-width:340px}
.night-card h2{font-family:var(--font-d);font-weight:600;margin:6px 0}
.night-card p{margin:0 0 12px}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-weight:700}

/* ---------- context panel ---------- */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);flex:none}
.tab{min-height:56px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected='true']{color:var(--accent);border-bottom-color:var(--accent)}
.panel-wrap{flex:1;overflow-y:auto;padding:14px;min-height:0}
.panel-wrap.leaving > *{opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s}
.panel-wrap.entering > *{animation:inUp .6s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes inUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px}
.card h3{font-family:var(--font-d);font-weight:600;font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
.card p{margin:6px 0}
.ap-chip{margin-left:auto;font-family:var(--font-b);font-size:14px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent-tint);color:var(--accent);white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:15px;margin:8px 0}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;font-weight:700}
.act-card.is-off{opacity:.8}
.why{display:flex;gap:6px;align-items:flex-start;color:var(--bad);font-weight:700;font-size:14px;margin:8px 0 0}
.act-card .btn{margin-top:8px}
.fact{display:flex;gap:8px;padding:10px;border-radius:12px;background:var(--accent-tint);font-size:15px}
.prog{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:6px 0}
.prog .bar{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.prog .bar span{display:block;height:100%;background:var(--accent);transition:width .8s var(--ease)}
.stage-steps{display:flex;gap:4px;margin:8px 0}
.stage-steps span{flex:1;font-size:14px;text-align:center;padding:3px 2px;border-radius:8px;background:var(--line);color:var(--muted);font-weight:700}
.stage-steps span.on{background:var(--accent);color:var(--accent-ink)}
.done-badge{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--good) 18%,var(--panel));color:var(--good);font-weight:800;font-size:14px}
.store-row{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.store-row .row .btn{font-size:14px;padding:6px 8px}
.listing{padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.log-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log-list li{font-size:15px;padding:8px 10px;border-radius:10px;background:var(--bg);border-left:4px solid var(--accent)}
.log-list li.sys{border-left-color:var(--warn)}
.log-list .r{font-size:14px;color:var(--muted);font-weight:700;display:block}
.empty{color:var(--muted);font-weight:600}
.status{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);opacity:0;z-index:50;padding:10px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;transition:opacity .3s,transform .4s var(--ease);max-width:min(92vw,520px);pointer-events:none}
.status.show{opacity:1;transform:translate(-50%,0)}

/* ---------- dialogs ---------- */
dialog{border:1px solid var(--line);border-radius:20px;padding:0;background:var(--panel);color:var(--ink);max-width:min(720px,94vw);width:100%;max-height:90dvh;box-shadow:0 20px 60px rgba(var(--shadow),.35)}
dialog::backdrop{background:rgba(20,26,30,.45)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dlg-head h2{font-family:var(--font-d);font-weight:600;font-size:22px;margin:0}
.dlg-head .icon-btn{margin-left:auto}
.dlg-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.demo-tag{font-size:14px;font-weight:800;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--warn) 22%,var(--panel))}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:14px;color:var(--muted)}
tr.idle td{background:color-mix(in srgb,var(--warn) 12%,transparent)}
.trend{display:inline-flex;gap:4px;align-items:center;font-weight:800}
.trend.better{color:var(--good)}.trend.worse{color:var(--bad)}.trend.same{color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.test-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.test-list li{display:flex;gap:8px;align-items:center;font-size:15px}
.test-list .pass{color:var(--good);font-weight:800}
.test-list .fail{color:var(--bad);font-weight:800}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.projector{max-width:100vw;width:100vw;height:100dvh;max-height:100dvh;border-radius:0}
.proj-body{padding:3vh 4vw;display:grid;gap:2.4vh;font-size:clamp(20px,2.6vw,34px)}
.proj-body h2{font-family:var(--font-d);font-size:clamp(32px,4.4vw,60px);margin:0}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2vh 3vw}
.proj-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:var(--bg)}
.proj-item .ic{width:40px;height:40px}
.counter{font-size:14px;color:var(--muted);text-align:right}

/* ---------- responsive ---------- */
@media (max-width:1400px){ .treasury .lbl{display:none} .teacher-btn .t-word{display:none} .teacher-btn{padding:8px 10px} .brand{font-size:22px} .gauge{min-width:0;flex:1 1 0;padding:4px 8px} .gauges{flex:1} }
@media (max-width:1100px){
  .only-narrow{display:inline-grid}
  .main{grid-template-columns:minmax(0,1fr) clamp(300px,34vw,360px)}
  .game.expanded .main{grid-template-columns:minmax(0,1fr) 0px}
  .citizen{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:40;transform:translateX(-105%);transition:transform .45s var(--ease);box-shadow:0 0 40px rgba(var(--shadow),.3)}
  .game.drawer-open .citizen{transform:none}
  .game.expanded .citizen{opacity:1}
  .gauge{min-width:126px}
  .gauge .g-bar{display:none}
  .treasury .lbl{display:none}
}
@media (max-width:760px){
  .game{grid-template-rows:auto minmax(0,1fr)}
  .topbar{flex-wrap:wrap;padding:8px 10px;gap:8px}
  .brand{font-size:20px}
  .gauges{order:5;width:100%;margin-left:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible}

  .game.expanded .context{transform:translateY(105%);opacity:1}
  .turn{bottom:calc(42dvh + 40px)}
  .caption{bottom:calc(42dvh + 4px)}
  .lite-btn{bottom:calc(42dvh + 4px)}
  .device-tag{left:8px;top:10px}
  .hint{top:52px;right:8px}
  .game.expanded .turn{bottom:46px}
  .game.expanded .caption,.game.expanded .lite-btn{bottom:8px}
  .hint{max-width:60%}
  .closed-banner{max-width:calc(100% - 80px);font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important;animation-delay:0s!important}
}

        <button id="resetBtn" aria-label="Reset the view"><svg class="ic"><use href="#i-home"/></svg></button>
      </div>
      <div class="hint" id="hint">Drag to spin · scroll to zoom · tap a tile</div>
      <div class="closed-banner" id="closedBanner" hidden><svg class="ic" aria-hidden="true"><use href="#i-lock"/></svg><span>The round is closed. Your teacher will open the next round.</span></div>

      <div class="device-tag"><svg class="ic sm" aria-hidden="true"><use href="#i-info"/></svg>Shared on this device only</div>

  const tiles = [];
  CONFIG.map.forEach((row, r) => [...row].forEach((ch, c) => tiles.push({ key: `${r},${c}`, r, c, extra: false, type: CONFIG.tileCodes[ch].type })));
  CONFIG.bridgeTiles.forEach((t) => tiles.push({ key: `${t.r},${t.c}`, r: t.r, c: t.c, extra: true, type: t.type }));

  const islandIds = new Set(cells.filter((c) => c.key).map((c) => c.id));

  for (let d = 1; d <= 12; d++) { const nx = []; bf.forEach((id) => cells[id].nb.forEach((n) => { if (!bdist.has(n) && !islandIds.has(n)) { bdist.set(n, d); nx.push(n); } })); bf = nx; }
  const nearBridge = new Set(); cells.forEach((c) => { if (!c.key && bdist.has(c.id) && bdist.get(c.id) <= (dist.get(c.id) ?? 99) + 1) nearBridge.add(c.id); });
  const LAND = -0.04, HOME_MAX = 5, MIN_LAND = 10;
  const far = cells.filter((c) => !c.key);
  far.forEach((c) => {
    c.e = fbm(c.n, 29); c.m = fbm(c.n, 37); c.d = dist.has(c.id) ? dist.get(c.id) : 99;
    c.nbc = c.nb.map((id) => cells[id]).filter((o) => !o.key);
    const reach = 1.5 + (fbm(c.n, 51) + 0.6) * 3.2;            // irregular coastline: about 1 to 5 cells of wild land
    if (nearBridge.has(c.id)) c.land = false;
    else if (c.d <= Math.min(HOME_MAX, reach)) { c.land = true; c.home = true; }
    else if (c.d <= HOME_MAX + 2) c.land = false;             // open sea around the home island
    else c.land = c.e > LAND;
  });
  for (let pass = 0; pass < 3; pass++) {                      // smooth coastlines (removes thin strands and specks)
    const next = new Map();
    far.forEach((c) => {
      if (c.home || nearBridge.has(c.id) || c.d <= HOME_MAX + 2) return;
      const ln = c.nbc.filter((o) => o.land).length, k = c.nbc.length;
      next.set(c.id, c.land ? ln >= Math.ceil(k / 2) - 1 : ln >= Math.ceil(k / 2) + 1);

  far.forEach((c) => {

    while (stack.length) { const x = stack.pop(); comp.push(x); x.nbc.forEach((o) => { if (o.land && !o.home && !seen.has(o.id)) { seen.add(o.id); stack.push(o); } }); }

  const tilesOfType = (s, type) => activeTiles(s).filter((t) => t.type === type);

  const levelFor = (xp) => 1 + Math.floor(xp / CONFIG.xpPerLevel);

  function waterBand(w) {
    return CONFIG.waterBands.find((b) => w >= b.min) || CONFIG.waterBands[CONFIG.waterBands.length - 1];
  }
  function devCounts(s) {
    const out = { farm: 0, forest: 0, quarry: 0, houses: 0 };

    return out;
  }
  function devBonus(s) {
    const D = CONFIG.dev, n = devCounts(s);

      stone: Math.min(D.quarryMax, Math.floor(n.quarry / D.quarryPer)), pollution: Math.min(D.quarryPollutionMax, n.quarry * D.quarryPollution),
      coins: n.houses * D.housesCoins, counts: n };
  }
  function farmYield(s) {
    const base = CONFIG.actions.farm.food + (s.projects.bridge.done ? CONFIG.projects.bridge.farmBonus : 0) + devBonus(s).food;
    return Math.max(CONFIG.minFood, Math.floor(base * waterBand(s.env.water).mult) - habPen(s, 'food'));
  }
  function habLevel(s) { return gaugeStatus('habitat', s.env.habitat == null ? 100 : s.env.habitat); }
  function habPen(s, kind) { const L = habLevel(s), H = CONFIG.habitat; return L === 'bad' ? (H.critical[kind] || 0) : L === 'warn' ? (H.pressure[kind] || 0) : 0; }
  const health = (s, key) => (s.tileHealth && s.tileHealth[key] != null ? s.tileHealth[key] : 100);
  function tileYield(base, h) { const P = CONFIG.places; return h >= P.full ? base : h >= P.low ? Math.max(1, base - 1) : Math.max(1, Math.floor(base / 2)); }
  function treesOn(s, key) {
    const cid = cellIdOf(key);
    if (cid != null) {
      const o = s.land && s.land[cid]; if (!o || o.type !== 'forest' || !o.dev) return 0;
      return Math.max(0, Math.min(CONFIG.treesPerTile, Math.round((s.env.forest / 100) * CONFIG.treesPerTile) - (s.harvest[key] || 0)));
    }
    const t = TILE[key];
    if (!t || t.type !== 'forest' || (t.extra && !s.projects.bridge.done)) return 0;

  }
  function storeBuyPrice(s, item) {

  }
  function storeSellPrice(s, item) {

  }
  function gaugeStatus(key, v) {
    const g = CONFIG.gaugeBands;

    return v >= g.goodFrom ? 'good' : v >= g.warnFrom ? 'warn' : 'bad';
  }
  function projectProgress(s, k) {
    const cfg = CONFIG.projects[k]; const p = s.projects[k];
    let need = 0, have = 0;
    for (const it in cfg.mat) { need += cfg.mat[it]; have += Math.min(p.mat[it] || 0, cfg.mat[it]); }
    const mat = need ? Math.floor((have / need) * 100) : 100;
    const labour = cfg.labour ? Math.floor((Math.min(p.labour, cfg.labour) / cfg.labour) * 100) : 100;

  function emptyProjects() {

    return out;
  }
  function freshStats(s) {

      startEnv: { ...s.env }, startTreasury: s.treasury,

  }
  function makeName(s, rng) {
    const used = new Set(s.citizens.map((c) => c.name));

      if (!used.has(n)) return n;

  function addLog(s, c, kind, text) {
    s.log.push({ id: s.seq++, round: s.round.n, cid: c ? c.id : null, name: c ? c.name : 'Village',
      prof: c ? CONFIG.professions[c.prof].name : '', kind, text, t: s.seq });
    if (s.log.length > CONFIG.logCap) s.log.splice(0, s.log.length - CONFIG.logCap);
  }
  function addCitizenMut(s, prof, rng) {
    const st = CONFIG.start;
    const c = { id: 'c' + (s.seq++), name: makeName(s, rng), prof,
      coins: st.coins, inv: { food: st.food, wood: st.wood, stone: st.stone, tools: st.tools },
      ap: CONFIG.apPerRound, xp: st.xp, hungry: false, apUsed: 0, actions: 0, contrib: 0, reflections: {} };
    s.citizens.push(c);
    return c;
  }

  function defaultState(rng = Math.random) {
    const s = { schema: CONFIG.schema, seq: 1, round: { n: 1, open: true, settled: [] },
      treasury: CONFIG.start.treasury, env: { ...CONFIG.env }, harvest: {}, minedTotal: 0,
      citizens: [], activeId: null, listings: [], projects: emptyProjects(), log: [],
      stats: null, summaries: {}, lastSummary: null, land: {}, works: { reclaim: null, link: null }, tileHealth: {}, rested: {} };
    Object.keys(CONFIG.professions).forEach((p) => addCitizenMut(s, p, rng));
    s.activeId = s.citizens[0].id;
    s.stats = freshStats(s);
    return s;
  }
  // ---- the planet beyond the island ----
  const cellKey = (id) => 'cell:' + id;
  const cellIdOf = (key) => (typeof key === 'string' && key.startsWith('cell:') ? Number(key.slice(5)) : null);
  function cellType(s, id) {
    const c = PLANET.cells[id]; if (!c) return null;
    const o = s.land && s.land[id];
    if (c.key) {
      if (c.extra && !s.projects.bridge.done) return c.under || 'shallow';
      if (o) return o.type;

    }
    return o ? o.type : c.type;
  }
  const HOME_WILD = PLANET.cells.filter((c) => c.home && ['beach', 'meadow', 'forest', 'grass'].includes(c.type)).map((c) => c.id);
  const isLand = (type) => type === 'island' || (!!CONFIG.terrain[type] && !CONFIG.terrain[type].water);
  const isSea = (type) => !!CONFIG.terrain[type] && !!CONFIG.terrain[type].sea;
  function villageLand(s) {                                   // every cell joined to the playable island by land or a bridge
    const seen = new Set(), stack = [];
    PLANET.cells.forEach((c) => { if (c.key && isLand(cellType(s, c.id))) { seen.add(c.id); stack.push(c.id); } });
    while (stack.length) {
      const id = stack.pop();
      for (const n of PLANET.cells[id].nb) { if (seen.has(n)) continue; const t = cellType(s, n); if (isLand(t) || t === 'bridge') { seen.add(n); stack.push(n); } }
    }
    return seen;
  }
  function seaStaysOpen(s, without) {                        // the ocean must stay one joined body of water
    const sea = (id) => { if (id === without) return false; const t = cellType(s, id); return t === 'bridge' ? isSea((s.land[id] && s.land[id].under) || 'shallow') : isSea(t); };
    let start = -1, total = 0;
    PLANET.cells.forEach((c) => { if (sea(c.id)) { total++; if (start < 0) start = c.id; } });
    if (start < 0) return true;
    const seen = new Set([start]), stack = [start];
    while (stack.length) { const x = stack.pop(); for (const n of PLANET.cells[x].nb) if (!seen.has(n) && sea(n)) { seen.add(n); stack.push(n); } }
    return seen.size === total;
  }
  function workCheck(s, kind, id) {
    const c = PLANET.cells[id]; if (!c) return 'Choose a tile first.';
    if (c.key) return c.extra ? 'This water is kept for the Stone Bridge.' : 'Choose water next to your land.';
    const t = cellType(s, id), vl = villageLand(s);
    const touches = c.nb.some((n) => vl.has(n) && isLand(cellType(s, n)));
    if (kind === 'reclaim') {
      if (t === 'deep') return 'This ocean is too deep to fill. Choose shallow ocean.';
      if (t !== 'shallow') return 'Only shallow ocean can be turned into land.';
      if (!touches) return 'New land must touch land your village already uses.';
      if (s.works.reclaim) return 'Finish the land reclamation that has already started.';
      if (!seaStaysOpen(s, id)) return 'This would cut off part of the ocean. Every ocean must stay joined to the open sea.';

    }
    if (!(CONFIG.terrain[t] || {}).water || t === 'bridge') return 'Island bridges are built over water: ocean, a river or a lake.';
    if (!touches) return 'A bridge must start from land your village already uses.';
    if (!c.nb.some((n) => !vl.has(n) && isLand(cellType(s, n)))) return 'There is no new land to reach on the far side of this water.';
    if (s.works.link) return 'Finish the island bridge that has already started.';

  }
  function startWork(s, cid, kind, id) {
    if (!CONFIG.works[kind]) return { ok: false, reason: 'Choose a project.', state: s };
    if (!s.round.open) return { ok: false, reason: 'The round is closed. Wait for your teacher to open the next round.', state: s };
    const c0 = citizen(s, cid); if (!c0) return { ok: false, reason: 'Choose a citizen first.', state: s };
    const why = workCheck(s, kind, id); if (why) return { ok: false, reason: why, state: s };
    const n = clone(s); n.works[kind] = { cell: id, mat: { wood: 0, stone: 0, tools: 0 } };
    addLog(n, citizen(n, cid), 'work', `${c0.name} started a ${CONFIG.works[kind].name.toLowerCase()} project.`);
    return { ok: true, state: n, event: { citizenId: cid, tileKey: cellKey(id) } };
  }
  function workProgress(s, kind) {
    const W = s.works && s.works[kind]; if (!W) return 0;
    const cfg = CONFIG.works[kind]; let need = 0, have = 0;
    for (const it in cfg.mat) { need += cfg.mat[it]; have += Math.min(W.mat[it] || 0, cfg.mat[it]); }
    return need ? Math.floor((have / need) * 100) : 100;
  }
  function upgradeState(s) {
    if (!s.land) s.land = {};
    if (!s.tileHealth) s.tileHealth = {};
    if (!s.rested) s.rested = {};

    if (s.stats && s.stats.startEnv && s.stats.startEnv.habitat == null) s.stats.startEnv.habitat = s.env.habitat;

  }
  function isValidState(s) {

      s.env && s.projects && s.round && s.stats && Object.keys(CONFIG.projects).every((k) => s.projects[k]);
  }

  // ---- choose tiles ----
  function pickTile(s, type, preferred) {
    if (preferred && TILE[preferred] && TILE[preferred].type === type && activeTiles(s).includes(TILE[preferred])) return TILE[preferred];
    return tilesOfType(s, type)[0] || null;
  }
  function workplaces(s, type) {                              // original tiles plus developed land of this type
    const out = activeTiles(s).filter((t) => t.type === type).map((t) => t.key);
    Object.entries(s.land || {}).forEach(([id, o]) => { if (o.dev && o.type === type) out.push(cellKey(Number(id))); });
    return out;
  }
  function pickPlace(s, type, preferred) {                   // the chosen place, or the healthiest one
    const list = workplaces(s, type); if (!list.length) return null;

  }

  function fishable(s, id, vl) {

  // ---- plan: what an action would do, and whether it is allowed ----
  function plan(s, cid, id, opt = {}) {
    const A = CONFIG.actions[id];
    const c = citizen(s, cid);
    const out = { ok: false, reason: '', id, ap: A ? A.ap : 1, gains: {}, costs: {}, env: {}, coins: 0, treasury: 0,
      tiles: [], tileKey: null, project: opt.project || null, item: opt.item || null, qty: 0, note: '' };
    if (!A) { out.reason = 'This action does not exist.'; return out; }
    if (!c) { out.reason = 'Choose a citizen first.'; return out; }
    let why = '';
    if (A.prof && c.prof !== A.prof) why = `Only a ${CONFIG.professions[A.prof].name.toLowerCase()} can do this.`;
    if ((id === 'plant' || id === 'clean') && !CONFIG.communityActions) why = 'This action is switched off.';
    switch (id) {
      case 'farm': {
        const key = pickPlace(s, 'farm', opt.tileKey);
        out.tileKey = key; out.health = health(s, key);
        out.tiles = (key ? [key] : []).concat(tilesOfType(s, 'river').map((x) => x.key));

      }

        out.tileKey = key || null; out.tiles = key ? [key] : []; out.health = key ? health(s, key) : 100;
        out.env = { soil: A.soil };

        break;
      }
      case 'deliver': {

        break;

        else if (!why && (qty < 1 || qty > A.maxUnits)) why = `You can donate 1 to ${A.maxUnits} at a time.`;

        if (!why && (cell == null || !PLANET.cells[cell])) why = 'Choose a tile first.';
        else if (!why && !CONFIG.dev.from.includes(t)) why = `${(CONFIG.terrain[t] || { name: 'This tile' }).name} cannot be developed. Choose beach, grass, meadow or new land.`;
        else if (!why && !villageLand(s).has(cell)) why = 'This land is not joined to your village yet.';
        if (!why) for (const it in D.cost) if (c.inv[it] < D.cost[it]) { why = `Not enough ${it}: you need ${D.cost[it]}.`; break; }
      }
    }
    if (id === 'develop' && CONFIG.dev.to[opt.to]) out.env = { habitat: CONFIG.habitat.dev[opt.to] || 0 };
    if (id === 'restore') {
      const cell = cellIdOf(opt.cell); const o = cell != null && s.land ? s.land[cell] : null;
      out.tileKey = opt.cell || null; out.tiles = opt.cell ? [opt.cell] : [];
      out.costs = { ...A.cost }; out.env = { habitat: A.habitat };
      if (!why && (!o || !o.dev || o.type === 'forest')) why = 'Only developed farms, quarries and houses can be restored to wild land.';

      out.work = opt.work;

        const need = cfgW.mat[item] != null ? cfgW.mat[item] - (W.mat[item] || 0) : 0;
        out.qty = Math.max(0, Math.min(qty, need)); if (out.qty) out.costs = { [item]: out.qty };
        out.item = item;
        if (!why && !ITEMS.includes(item)) why = 'Choose what to donate.';
        else if (!why && need <= 0) why = `This project does not need any more ${item}.`;
        else if (!why && (qty < 1 || qty > CONFIG.actions.giveWork.maxUnits)) why = `You can donate 1 to ${CONFIG.actions.giveWork.maxUnits} at a time.`;
        else if (!why && c.inv[item] < out.qty) why = `Not enough ${item}: you have ${c.inv[item]}.`;
      }
    }

    else if (c.ap < out.ap) out.reason = `You have used all your action points this round.`;
    else out.reason = why;
    out.ok = !out.reason;

  }

  function completeIfReady(n, k, ev) {
    const p = n.projects[k];
    if (p.done) return;
    const pr = projectProgress(n, k);
    if (pr.mat >= 100 && pr.labour >= 100) {
      p.done = true;
      n.treasury += CONFIG.completionBonus;
      addLog(n, null, 'project', `The ${CONFIG.projects[k].name} is finished! The treasury gets ${CONFIG.completionBonus} coins.`);
      ev.completed = k;
    }
  }

  function doAction(s, cid, id, opt = {}) {

    clouds.forEach((g) => { const u = g.userData; if (!reduced()) u.a += dt * u.sp; g.position.copy(u.base).applyAxisAngle(u.axis, u.a); g.lookAt(0, 0, 0); });
    // figures
    figures.forEach((fg) => {
      if (!fg.g.visible) return;
      fg.fy = 0;
      if (fg.walk) {
        const w = fg.walk; w.t += dt;
        if (w.t < 1.1) { const k = w.t / 1.1; fg.fx = w.x0 + (w.x1 - w.x0) * k; fg.fz = w.z0 + (w.z1 - w.z0) * k; fg.yaw = Math.atan2(w.x1 - w.x0, w.z1 - w.z0); }
        else if (w.t < 2.1) { fg.fx = w.x1; fg.fz = w.z1; fg.fy = Math.abs(Math.sin((w.t - 1.1) * 9)) * 0.06; }
        else if (w.t < 3.2) { const k = (w.t - 2.1) / 1.1; fg.fx = w.x1 + (w.x0 - w.x1) * k; fg.fz = w.z1 + (w.z0 - w.z1) * k; fg.yaw = Math.atan2(w.x0 - w.x1, w.z0 - w.z1); }
        else fg.walk = null;
      } else if (!reduced()) {
        const dx = fg.tx - fg.fx, dz = fg.tz - fg.fz, d = Math.hypot(dx, dz);
        if (d < 0.05) { fg.tx = TOWN[0] + rnd(); fg.tz = TOWN[1] + rnd(); }
        else { const sp = (idle ? 0.22 : 0.12) * dt; fg.fx += (dx / d) * sp; fg.fz += (dz / d) * sp; fg.yaw = Math.atan2(dx, dz); }
      }
      const fr = nq(fg.fx, fg.fz);
      fg.g.position.copy(fr.n).multiplyScalar(R + fg.fy);
      fg.g.quaternion.copy(fr.q).multiply(qLoc.setFromAxisAngle(UP, fg.yaw));
    });
    const af = view && figureFor(view.activeId);
    activeRing.visible = !!af;
    if (af) { const fr = nq(af.fx, af.fz); placeObj(activeRing, fr, 0.012); }
    // highlights
    const keys = previewKeys.filter((k) => isCellKey(k) || (RULES.TILE[k] && (!RULES.TILE[k].extra || rise > 0.5)));
    hiMesh.count = keys.length;
    keys.forEach((k, i) => { const fr = frameOfKey(k); const s = fr.rad / HEXR; hiMesh.setMatrixAt(i, compose(fr, topOfKey(k) + 0.03, -fr.phi, 0, s, 1, s)); });
    hiMesh.instanceMatrix.needsUpdate = true;
    hiMesh.material.opacity = reduced() ? 0.4 : 0.3 + Math.sin(t * 5) * 0.15;
    selGlow.material.opacity = reduced() ? 0.35 : 0.28 + Math.sin(t * 3) * 0.1;
    // confetti (falls back towards the planet)
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i]; c.life -= dt; c.v.addScaledVector(c.n, -4 * dt); c.m.position.addScaledVector(c.v, dt); c.m.rotation.x += dt * 6; c.m.rotation.y += dt * 4;
      if (c.life <= 0) { scene.remove(c.m); c.m.material.dispose(); confetti.splice(i, 1); }
    }
    // labels: hide anything on the far side of the planet
    for (const L of labels) {
      if (!L.isVisible()) { L.el.style.display = 'none'; continue; }
      wp.copy(L.getPos()); planet.localToWorld(wp);
      toCam.subVectors(camera.position, wp);
      if (wp.dot(toCam) < 0) { L.el.style.display = 'none'; continue; }
      v3.copy(wp).project(camera);
      if (v3.z > 1 || v3.x < -1.2 || v3.x > 1.2 || v3.y < -1.2 || v3.y > 1.2) { L.el.style.display = 'none'; continue; }
      L.el.style.display = '';
      const x = (v3.x * 0.5 + 0.5) * W, y = (-v3.y * 0.5 + 0.5) * H;
      L.el.style.transform = L.pin ? `translate(${x - 22}px,${y - 44}px)` : `translate(${x}px,${y}px) translate(-50%,-100%)`;
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const fl = floats[i]; fl.t += dt;
      if (fl.t < 0) { fl.L.el.style.opacity = 0; continue; }
      const k = fl.t / 1.6; fl.L.el.style.opacity = reduced() ? (k < 0.9 ? 1 : 0) : String(Math.max(0, 1 - k * k));
      if (!reduced()) fl.L.el.style.marginTop = `${-k * 46}px`;

  }
  function frame(now) {
    if (!running) return;
    const raw = Math.max(0, (now - last) / 1000); const dt = Math.min(0.05, raw); last = now;
    update(dt, now / 1000);
    renderer.render(scene, camera);
    // automatic Lite mode if below 30 fps for 3 seconds (measured in real time)
    warm += raw; fpsAcc += raw; fpsFrames++;
    if (fpsAcc >= 1) {

  });
  resize(); writeFarms(0, false);
  requestAnimationFrame(frame);

  return { sync, select, setSelLabel, setCursor, setPreview, setLabels, setLight, setLite, isLite: () => lite,
    disableAutoLite: () => { autoLiteAllowed = false; }, zoomBy, rotate, tour, home, flyTo, playAction, floatLabel, celebrate, touch };
}

function cellHTML(id) {

function tileShortLabel(key) {

// ---- applying results ----
function commit(res, opts = {}) {
  if (!res.ok) { toast(res.reason); announce(res.reason); return false; }
  state = res.state;
  if (!Store.save(state)) toast('This device could not save the game. Progress may be lost when the page closes.');
  renderAll();
  const ev = res.event;
  if (ev && world) {
    const c = RULES.citizen(state, ev.citizenId);
    if (ev.tileKey) world.playAction(ev.citizenId, ev.tileKey);
    const g = fmtGains(ev);
    const key = ev.tileKey || (ui.selected || '3,3');
    if (g) world.floatLabel(key, g, 0.6);
    if (ev.env && Object.keys(ev.env).length) world.floatLabel(key, fmtEnv(ev.env), 1.1);
    if (ev.qty && ev.item) world.floatLabel(key, `+${ev.qty} ${ev.item} donated`, 0.6);
    if (ev.completed) { world.celebrate(ev.completed); toast(`The ${CONFIG.projects[ev.completed].name} is finished!`); }
    if (ev.workDone) { world.celebrate('cell:' + ev.workCell); toast(ev.workDone === 'reclaim' ? 'New land rises from the sea!' : 'The island bridge is finished. A new island joins the village!'); }
    if (ev.levelUp) toast(`${c ? c.name : 'You'} reached level ${ev.levelUp}!`);
  }
  const last = state.log[state.log.length - 1];
  if (last) announce(last.text);
  return true;
}
function renderAll() {
  renderTop(); renderCitizen(); renderPanel();
  if (world) { world.sync(state); if (ui.selected) world.setSelLabel(tileShortLabel(ui.selected)); }
}

function selectTile(key) {
  ui.selected = key; ui.cursor = key; ui.factIdx++;
  if (world) { world.select(key); world.setSelLabel(tileShortLabel(key)); world.setCursor(null); }
  setTab('tile');
}

// ---- events ----
function wire() {
  $('#tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) setTab(b.dataset.tab); });
  $('#tabs').addEventListener('keydown', (e) => {
    const i = TABS.indexOf(ui.tab); let n = null;
    if (e.key === 'ArrowRight') n = (i + 1) % TABS.length; else if (e.key === 'ArrowLeft') n = (i - 1 + TABS.length) % TABS.length;
    else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = TABS.length - 1;
    if (n != null) { e.preventDefault(); setTab(TABS[n], true); }
  });
  const wrap = $('#panelWrap');
  wrap.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const c = active();
    if (b.getAttribute('aria-disabled') === 'true') {
      const card = b.closest('[data-preview]');
      if (card && b.dataset.act === 'action') { const d = JSON.parse(card.dataset.preview); const p = RULES.plan(state, c.id, b.dataset.id, JSON.parse(b.dataset.opt || '{}')); toast(p.reason || 'This is not possible right now.'); void d; }
      else toast(state.round.open ? 'This is not possible right now.' : 'The round is closed.');
      return;
    }
    switch (b.dataset.act) {
      case 'action': commit(RULES.doAction(state, c.id, b.dataset.id, JSON.parse(b.dataset.opt || '{}'))); break;
      case 'tab': setTab(b.dataset.tab); break;
      case 'fly': if (world && ui.selected) world.flyTo(ui.selected); break;
      case 'storeBuy': commit(RULES.storeBuy(state, c.id, b.dataset.item, 1)); break;
      case 'storeSell': commit(RULES.storeSell(state, c.id, b.dataset.item, 1)); break;
      case 'cancel': commit(RULES.cancelListing(state, c.id, b.dataset.id)); break;
      case 'buyL': commit(RULES.buyListing(state, c.id, b.dataset.id, Number(b.dataset.qty))); break;
      case 'list': commit(RULES.createListing(state, c.id, $('#lItem').value, $('#lQty').value, $('#lPrice').value)); break;
      case 'donate': {
        const card = b.closest('.card'); const item = $('[data-role="dItem"]', card).value; const qty = Number($('[data-role="dQty"]', card).value);
        commit(RULES.doAction(state, c.id, 'donate', { project: b.dataset.project, item, qty })); break;
      }
      case 'summary': openSummary(state.lastSummary); break;
      case 'startWork': commit(RULES.startWork(state, c.id, b.dataset.kind, Number(b.dataset.cell))); break;
      case 'flyCell': if (world) world.flyTo('cell:' + b.dataset.cell); break;
      case 'giveWork': {
        const card = b.closest('.card'); const item = $('[data-role="dItem"]', card).value; const qty = Number($('[data-role="dQty"]', card).value);
        commit(RULES.doAction(state, c.id, 'giveWork', { work: b.dataset.work, item, qty })); break;
      }
    }
  });
  const preview = (card) => {
    if (!card || !world) { if (world) world.setPreview([]); setGhosts(null); return; }
    const d = JSON.parse(card.dataset.preview); const p = RULES.plan(state, state.activeId, d.id, d.opt);
    world.setPreview(p.tiles); setGhosts(p.env);
  };
  wrap.addEventListener('pointerover', (e) => preview(e.target.closest('[data-preview]')));
  wrap.addEventListener('pointerleave', () => preview(null));
  wrap.addEventListener('focusin', (e) => preview(e.target.closest('[data-preview]')));
  wrap.addEventListener('focusout', (e) => { if (!wrap.contains(e.relatedTarget)) preview(null); });

  $('#citizenPanel').addEventListener('change', (e) => {
    if (e.target.id === 'czSelect') { commit(RULES.setActive(state, e.target.value)); }
  });
  $('#citizenPanel').addEventListener('click', (e) => {
    if (e.target.closest('#addCz')) {
      if (state.citizens.length >= CONFIG.maxCitizens) { toast(`The village is full. The limit is ${CONFIG.maxCitizens} citizens.`); return; }
      if (commit(RULES.addCitizen(state, $('#newProf').value))) toast(`Welcome, ${active().name}.`);
    }
  });
  $('#drawerBtn').addEventListener('click', () => {
    const open = !game.classList.contains('drawer-open'); game.classList.toggle('drawer-open', open);
    $('#drawerBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    $('#drawerBtn').setAttribute('aria-label', open ? 'Hide citizen panel' : 'Show citizen panel');
  });
  $('#stage').addEventListener('pointerdown', () => { if (game.classList.contains('drawer-open')) $('#drawerBtn').click(); });

  // view controls
  $('#zoomInBtn').addEventListener('click', () => world && world.zoomBy(1.25));
  $('#zoomOutBtn').addEventListener('click', () => world && world.zoomBy(0.8));
  $('#resetBtn').addEventListener('click', () => world && world.home());
  $('#expandBtn').addEventListener('click', () => setExpanded(!ui.expanded));
  $('#labelsBtn').addEventListener('click', () => {
    ui.labels = !ui.labels; world && world.setLabels(ui.labels);
    $('#labelsBtn').setAttribute('aria-pressed', ui.labels ? 'true' : 'false');
    $('#labelsBtn').setAttribute('aria-label', ui.labels ? 'Hide tile labels' : 'Show tile labels');
  });
  $('#rotLBtn').addEventListener('click', () => world && world.rotate(-1));
  $('#rotRBtn').addEventListener('click', () => world && world.rotate(1));
  $('#tourBtn').addEventListener('click', () => { if (world && !world.tour()) toast('The tour is off because reduced motion is switched on.'); });
  $('#liteBtn').addEventListener('click', () => { if (!world) return; world.disableAutoLite(); world.setLite(!world.isLite()); renderLite(); });

  const stage = $('#stage');
  ['pointerdown', 'wheel', 'keydown'].forEach((ev) => stage.addEventListener(ev, hideHint, { passive: true }));
  stage.addEventListener('keydown', (e) => {
    if (e.target !== stage || !world) return;
    const [r, c] = ui.cursor.split(',').map(Number); let nr = r, nc = c;
    const k = e.key;
    if (k === 'ArrowUp') nr--; else if (k === 'ArrowDown') nr++; else if (k === 'ArrowLeft') nc--; else if (k === 'ArrowRight') nc++;
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); selectTile(ui.cursor); return; }
    else if (k === 'q' || k === 'Q') { world.rotate(-1); return; }
    else if (k === 'e' || k === 'E') { world.rotate(1); return; }
    else if (k === '+' || k === '=') { world.zoomBy(1.25); return; }
    else if (k === '-' || k === '_') { world.zoomBy(0.8); return; }
    else if (k === '0') { world.home(); return; }
    else return;
    e.preventDefault();
    const nk = `${nr},${nc}`;
    if (RULES.activeTiles(state).some((t) => t.key === nk)) { ui.cursor = nk; world.setCursor(nk); world.touch(); announce(tileShortLabel(nk)); }
  });
  stage.addEventListener('focus', () => { if (world) world.setCursor(ui.cursor); });
  stage.addEventListener('blur', () => { if (world) world.setCursor(null); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.expanded && !document.querySelector('dialog[open]')) setExpanded(false); });
  $('#teacherBtn').addEventListener('click', openTeacher);
  $('#skipNight').addEventListener('click', endNight);
}
function hideHint() {

function setExpanded(on) {

function trendHTML(key, before, after) {

  return `<span class="trend ${better ? 'better' : 'worse'}">${icon(d > 0 ? 'i-up' : 'i-down', 'ic sm')}${d > 0 ? '+' : ''}${d} ${better ? 'Better' : 'Worse'}</span>`;
}
function openSummary(round) {

    <div class="dlg-body">

        <tr><td>${icon('i-coin', 'ic sm')} Treasury</td><td>${sm.treasuryBefore} coins</td><td>${sm.treasuryAfter} coins</td><td>${trendHTML('treasury', sm.treasuryBefore, sm.treasuryAfter)}</td></tr></tbody></table></div>
      <p><b>Made this round:</b> ${RULES.ITEMS.map((it) => `${sm.produced[it]} ${it}`).join(', ')}. <b>Coins traded:</b> ${sm.traded}.</p>
      <div><b>Projects</b><ul>${sm.projects.map((p) => `<li>${esc(CONFIG.projects[p.key].name)}: ${p.before}% to ${p.after}%${p.done ? ' (finished)' : ''}</li>`).join('')}</ul></div>
      <p>${icon('i-bowl', 'ic sm')} ${sm.hungry.length ? `<b>${sm.hungry.length} citizens went hungry:</b> ${esc(sm.hungry.join(', '))}. They have 1 fewer action point this round.` : '<b>Nobody went hungry.</b>'}</p>
      <div class="card"><h3>${icon('i-pen')}Think about it</h3><p>${esc(prompt)}</p>
        <label class="field" for="reflText">Your answer, saved for ${esc(c.name)}</label>
        <textarea id="reflText" maxlength="${CONFIG.reflectionMax}">${esc(saved)}</textarea>
        <div class="counter" id="reflCount">${saved.length} of ${CONFIG.reflectionMax} characters</div>
        <p class="small">To save another answer, close this card, switch citizen in the left panel and open the summary from the Log tab.</p>
        <div class="btn-row"><button class="btn primary" id="reflSave">Save my answer</button><span id="reflMsg" class="small" role="status"></span></div></div>
      <button class="btn" data-close>Back to the island</button>
    </div>`;
  dlg.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => dlg.close()));
  const ta = $('#reflText', dlg);
  ta.addEventListener('input', () => { $('#reflCount', dlg).textContent = `${ta.value.length} of ${CONFIG.reflectionMax} characters`; });
  $('#reflSave', dlg).addEventListener('click', () => {
    const r = RULES.saveReflection(state, c.id, round, ta.value);
    if (!r.ok) { $('#reflMsg', dlg).textContent = r.reason; return; }
    state = r.state; Store.save(state); $('#reflMsg', dlg).textContent = 'Saved.';
  });
  dlg.showModal();
}

// ---- night ----
let pendingSummary = null;
function startNight(summaryRound) {
  pendingSummary = summaryRound;
  const stage = $('#stage');
  if (world) world.setLight('night');
  stage.classList.add('is-night'); $('#night').hidden = false;
  $('#skipNight').focus();
  clearTimeout(ui.nightTimer);
  ui.nightTimer = setTimeout(endNight, reducedMotion() ? 1200 : 3000);
}
function endNight() {
  clearTimeout(ui.nightTimer);
  if ($('#night').hidden) return;
  $('#night').hidden = true; $('#stage').classList.remove('is-night');
  if (world) world.setLight(state.round.open ? 'day' : 'dusk');
  if (pendingSummary) { const r = pendingSummary; pendingSummary = null; openSummary(r); }
}

function csvCell(v) {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildCSV(s) {
  const lines = [['Section', 'Round', 'Citizen', 'Profession', 'Type', 'Details'].join(',')];
  s.log.forEach((l) => lines.push(['Activity', l.round, l.name, l.prof, l.kind, l.text].map(csvCell).join(',')));
  s.citizens.forEach((c) => Object.entries(c.reflections).forEach(([r, t]) => lines.push(['Reflection', r, c.name, CONFIG.professions[c.prof].name, 'reflection', t].map(csvCell).join(','))));
  return lines.join('\r\n');
}

/*@TESTS-START*/
function mulberry(seed) { return function () { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const TESTS = [
  ['Action points can never go above 6', () => {
    let s = RULES.defaultState(mulberry(1)); const f = s.citizens.find((c) => c.prof === 'farmer');
    for (let i = 0; i < 6; i++) { const r = RULES.doAction(s, f.id, 'farm'); if (!r.ok) throw new Error('action ' + i + ' failed'); s = r.state; }
    if (RULES.doAction(s, f.id, 'farm').ok) throw new Error('7th action allowed');
    s = RULES.advanceRound(s).state; s = RULES.advanceRound(s).state;
    return s.citizens.every((c) => c.ap <= CONFIG.apPerRound);
  }],
  ['You cannot buy without enough coins or stock', () => {
    let s = RULES.defaultState(mulberry(2)); const [a, b] = s.citizens;
    s.citizens[0].coins = 0;
    if (RULES.storeBuy(s, a.id, 'food', 1).ok) throw new Error('bought with no coins');
    s = RULES.createListing(s, b.id, 'wood', 1, 3).state;
    const lid = s.listings[0].id;
    if (RULES.buyListing(s, s.citizens[2].id, lid, 2).ok) throw new Error('bought more than stock');
    return !RULES.buyListing(s, a.id, lid, 1).ok;
  }],
  ['Seller and treasury get the right amounts after tax', () => {
    let s = RULES.defaultState(mulberry(3)); const seller = s.citizens[0], buyer = s.citizens[1];
    s = RULES.createListing(s, seller.id, 'wood', 2, 10).state;
    const t0 = s.treasury, c0 = RULES.citizen(s, seller.id).coins, b0 = RULES.citizen(s, buyer.id).coins;
    s = RULES.buyListing(s, buyer.id, s.listings[0].id, 2).state;
    return RULES.citizen(s, seller.id).coins === c0 + 19 && s.treasury === t0 + 1 && RULES.citizen(s, buyer.id).coins === b0 - 20 && !RULES.buyListing(s, seller.id, 'none', 1).ok;
  }],
  ['Donated items cannot be traded', () => {
    let s = RULES.defaultState(mulberry(4)); const c = s.citizens[0];
    s = RULES.doAction(s, c.id, 'donate', { project: 'market', item: 'wood', qty: 2 }).state;
    return RULES.citizen(s, c.id).inv.wood === 0 && !RULES.createListing(s, c.id, 'wood', 1, 5).ok && !RULES.storeSell(s, c.id, 'wood', 1).ok;
  }],
  ['Finished projects reject donations and shifts', () => {
    const s = RULES.defaultState(mulberry(5)); s.projects.market.done = true;
    const b = s.citizens.find((c) => c.prof === 'builder');
    return !RULES.doAction(s, s.citizens[0].id, 'donate', { project: 'market', item: 'wood', qty: 1 }).ok && !RULES.doAction(s, b.id, 'shift', { project: 'market' }).ok;
  }],
  ['Projects need both materials and builder shifts', () => {
    let s = RULES.defaultState(mulberry(6)); const b = s.citizens.find((c) => c.prof === 'builder');
    s.projects.market.mat = { ...CONFIG.projects.market.mat };
    s.citizens[0].inv.wood = 5;
    if (RULES.doAction(s, s.citizens[0].id, 'donate', { project: 'market', item: 'wood', qty: 1 }).ok) throw new Error('over-donation allowed');
    for (let i = 0; i < CONFIG.projects.market.labour - 1; i++) s = RULES.doAction(s, b.id, 'shift', { project: 'market' }).state;
    if (s.projects.market.done) throw new Error('finished without full labour');
    const t0 = s.treasury;
    s = RULES.doAction(s, b.id, 'shift', { project: 'market' }).state;
    return s.projects.market.done && s.treasury === t0 - CONFIG.actions.shift.wage + CONFIG.completionBonus;
  }],
  ['The Water Treatment Plant applies its effects', () => {
    const s = RULES.defaultState(mulberry(7)); s.env.water = 40; s.env.pollution = 50; s.projects.wtp.done = true;
    const n = RULES.advanceRound(s).state; const S = CONFIG.settlement, P = CONFIG.projects.wtp;

  }],
  ['Low water reduces farm output correctly', () => {
    const s = RULES.defaultState(mulberry(8)); const out = [];
    for (const w of [90, 60, 30, 10]) { s.env.water = w; out.push(RULES.farmYield(s)); }
    return out.join(',') === '3,2,1,1';
  }],
  ['Ending a round applies action points and land changes exactly once', () => {
    let s = RULES.defaultState(mulberry(9)); const f = s.citizens.find((c) => c.prof === 'farmer');
    s = RULES.doAction(s, f.id, 'farm').state; const env0 = { ...s.env };
    const r = RULES.advanceRound(s); const n = r.state; const S = CONFIG.settlement;
    const ok = n.env.forest === Math.min(100, env0.forest + S.forest) && n.env.soil === env0.soil + S.soil && n.env.water === env0.water + S.water && n.env.pollution === env0.pollution + S.pollution;

  ['No value ever goes below zero', () => {
    const rng = mulberry(10); let s = RULES.defaultState(rng);

    const pk = Object.keys(CONFIG.projects);
    for (let i = 0; i < 600; i++) {

      if (x < 0.6) r = RULES.doAction(s, c.id, acts[Math.floor(rng() * acts.length)], { project: pk[Math.floor(rng() * 4)], item: RULES.ITEMS[Math.floor(rng() * 4)], qty: 1 + Math.floor(rng() * 3) });
      else if (x < 0.7) r = RULES.storeBuy(s, c.id, RULES.ITEMS[Math.floor(rng() * 4)], 1);
      else if (x < 0.78) r = RULES.storeSell(s, c.id, RULES.ITEMS[Math.floor(rng() * 4)], 1);
      else if (x < 0.86) r = RULES.createListing(s, c.id, RULES.ITEMS[Math.floor(rng() * 4)], 1, 1 + Math.floor(rng() * 9));
      else if (x < 0.94 && s.listings.length) r = RULES.buyListing(s, c.id, s.listings[0].id, 1);
      else r = RULES.advanceRound(s);

    }
    const nums = [s.treasury, ...Object.values(s.env), ...s.citizens.flatMap((c) => [c.coins, c.ap, c.xp, ...Object.values(c.inv)]),
      ...Object.values(s.projects).flatMap((p) => [p.labour, ...Object.values(p.mat)]), ...s.listings.map((l) => l.qty), ...Object.values(s.tileHealth)];
    return nums.every((v) => Number.isInteger(v) && v >= 0) && Object.values(s.env).every((v) => v <= 100);
  }],
  ['Land reclamation must touch village land and creates land that can be developed', () => {
    let s = RULES.defaultState(mulberry(11)); const vl = RULES.villageLand(s);
    const farSea = PLANET.cells.find((c) => RULES.cellType(s, c.id) === 'shallow' && !c.key && !c.nb.some((n) => vl.has(n)));
    if (RULES.startWork(s, s.citizens[0].id, 'reclaim', farSea.id).ok) throw new Error('reclaimed ocean far from the village');
    const spot = PLANET.cells.find((c) => RULES.workCheck(s, 'reclaim', c.id) === '');

    s = fillWork(s, 'reclaim');
    if (RULES.cellType(s, spot.id) !== 'newland' || s.works.reclaim || !RULES.villageLand(s).has(spot.id)) throw new Error('no new land');

  ['Natural Habitat stays between 0 and 100', () => {
    const id = PLANET.cellOfKey[RULES.TILES.find((t) => t.type === 'land').key];
    let s = RULES.defaultState(mulberry(15)); s.env.habitat = 2; s.citizens[0].inv.wood += 2;
    const a = RULES.doAction(s, s.citizens[0].id, 'develop', { cell: RULES.cellKey(id), to: 'farm' });

  ['Each development changes Natural Habitat by the right amount', () => {
    const id = PLANET.cellOfKey[RULES.TILES.find((t) => t.type === 'land').key];

  ['Resting a field costs 2 AP, gives no food and helps the soil', () => {

    const key = RULES.TILES.find((t) => t.type === 'farm').key; s.tileHealth[key] = 30; s.env.soil = 50;
    const food0 = f.inv.food, r = RULES.doAction(s, f.id, 'rest', { tileKey: key });

    const f2 = RULES.citizen(r.state, f.id); const n = RULES.advanceRound(r.state).state;
    return f2.ap === CONFIG.apPerRound - 2 && f2.inv.food === food0 && r.state.env.soil === 53 && RULES.health(r.state, key) === 50
      && RULES.health(n, key) === 50 + CONFIG.places.recover + CONFIG.places.restBonus;

  ['Restoring land costs 3 AP plus materials and raises Natural Habitat', () => {
    const id = PLANET.cellOfKey[RULES.TILES.find((t) => t.type === 'land').key], key = RULES.cellKey(id);
    let s = RULES.defaultState(mulberry(20)); const c = s.citizens[0]; c.inv.wood += 6; c.inv.tools += 2;
    s = RULES.doAction(s, c.id, 'develop', { cell: key, to: 'farm' }).state;
    const h0 = s.env.habitat, c0 = RULES.citizen(s, c.id);
    const r = RULES.doAction(s, c.id, 'restore', { cell: key }); if (!r.ok) throw new Error(r.reason);
    const c1 = RULES.citizen(r.state, c.id);
    return RULES.cellType(r.state, id) === 'openland' && r.state.env.habitat === h0 + CONFIG.actions.restore.habitat
      && c1.ap === c0.ap - 3 && c1.inv.tools === c0.inv.tools - 1 && c1.inv.wood === c0.inv.wood - 2;
  }],
  ['A critical Natural Habitat removes exactly one AP', () => {
    const s = RULES.defaultState(mulberry(18)); s.env.habitat = 20; s.citizens[0].inv.food = 0;
    const n = RULES.advanceRound(s).state;
    return n.citizens.every((c) => c.ap === CONFIG.apPerRound - 1);
  }],
  ['Open land on the island can be developed', () => {
    let s = RULES.defaultState(mulberry(14));
    const key = RULES.TILES.find((t) => t.type === 'land').key, id = PLANET.cellOfKey[key];
    if (RULES.cellType(s, id) !== 'openland') throw new Error('not open land');
    s.citizens[0].inv.wood += 2; s.citizens[0].inv.stone += 2;
    const r = RULES.doAction(s, s.citizens[0].id, 'develop', { cell: RULES.cellKey(id), to: 'houses' });
    return r.ok && RULES.cellType(r.state, id) === 'houses' && RULES.devBonus(r.state).coins === CONFIG.dev.housesCoins;
  }],
  ['Oceans cannot be cut off from the open sea', () => {
    const s = RULES.defaultState(mulberry(12));
    const ok = (t) => t === 'shallow' || RULES.isLand(t);
    const x = PLANET.cells.find((c) => RULES.workCheck(s, 'reclaim', c.id) === '' && c.nb.every((n) => !PLANET.cells[n].key && ok(RULES.cellType(s, n))) && c.nb.filter((n) => RULES.cellType(s, n) === 'shallow').length >= 2);

    let s = RULES.defaultState(mulberry(13)); const vl = RULES.villageLand(s);

    let goal = -1;
    while (queue.length && goal < 0) {
      const id = queue.shift();
      if (PLANET.cells[id].nb.some((n) => !vl.has(n) && RULES.isLand(RULES.cellType(s, n)))) { goal = id; break; }
      PLANET.cells[id].nb.forEach((n) => { if (!prev.has(n) && shallow(n)) { prev.set(n, id); queue.push(n); } });

    s = fillWork(s, 'link');

function fillWork(s, kind) {
  const c0 = s.citizens[0]; c0.inv.stone += 60; c0.inv.wood += 60; c0.inv.tools += 20; c0.inv.food += 60;
  for (let i = 0; i < 300 && s.works[kind]; i++) {
    const W = s.works[kind], cfg = CONFIG.works[kind];
    const item = Object.keys(cfg.mat).find((it) => (W.mat[it] || 0) < cfg.mat[it]);
    const r = RULES.doAction(s, c0.id, 'giveWork', { work: kind, item, qty: 3 });
    s = r.ok ? r.state : RULES.advanceRound(s).state;
  }
  return s;
}
function runTests() {
  return TESTS.map(([name, fn]) => { try { return { name, pass: !!fn() }; } catch (e) { return { name, pass: false, err: e.message }; } });
}

renderLite();
